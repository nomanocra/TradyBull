<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Taureau stylisé moderne pour TradyBull -->

  <!-- Cornes -->
  <path d="M20 35 Q10 20 5 10" stroke="#C59471" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M80 35 Q90 20 95 10" stroke="#C59471" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- Tête du taureau -->
  <ellipse cx="50" cy="50" rx="32" ry="28" fill="#C59471"/>

  <!-- Oreilles -->
  <ellipse cx="22" cy="38" rx="8" ry="5" fill="#C59471" transform="rotate(-30 22 38)"/>
  <ellipse cx="78" cy="38" rx="8" ry="5" fill="#C59471" transform="rotate(30 78 38)"/>

  <!-- Museau -->
  <ellipse cx="50" cy="68" rx="18" ry="14" fill="#A67B5B"/>

  <!-- Narines -->
  <ellipse cx="42" cy="70" rx="4" ry="3" fill="#8B6347"/>
  <ellipse cx="58" cy="70" rx="4" ry="3" fill="#8B6347"/>

  <!-- Yeux -->
  <circle cx="35" cy="45" r="5" fill="#2D2D2D"/>
  <circle cx="65" cy="45" r="5" fill="#2D2D2D"/>

  <!-- Reflets des yeux -->
  <circle cx="37" cy="43" r="1.5" fill="#FFFFFF"/>
  <circle cx="67" cy="43" r="1.5" fill="#FFFFFF"/>

  <!-- Anneau de nez (symbole trading/finance) -->
  <circle cx="50" cy="78" r="6" stroke="#D4AF37" stroke-width="2.5" fill="none"/>
</svg>
